services:
  web:
    build:
      context: .
      dockerfile: src/Aegis.Studio.Web/Dockerfile
    environment:
      Database__Host: axios
      Database__Name: AegisStudio
      AEGIS_PG_USER: ${AEGIS_PG_USER}
      AEGIS_PG_PASSWORD: ${AEGIS_PG_PASSWORD}
    ports:
      - "8080:8080"
  service:
    build:
      context: .
      dockerfile: src/Aegis.Studio.Service/Dockerfile
    environment:
      Database__Host: axios
      Database__Name: AegisStudio
      AEGIS_PG_USER: ${AEGIS_PG_USER}
      AEGIS_PG_PASSWORD: ${AEGIS_PG_PASSWORD}
