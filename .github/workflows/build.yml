name: build

on:
  push:
    branches:
      - main
      - development
      - chatgpt/shared-pos-web-device-agent
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Mirror local sibling Common layout
        shell: pwsh
        run: |
          $siblingCommon = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $siblingCommon) {
            Remove-Item $siblingCommon -Recurse -Force
          }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $siblingCommon

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Aegis.Studio.slnx
      - run: dotnet build Aegis.Studio.slnx --no-restore --configuration Release
      - run: dotnet test Aegis.Studio.slnx --no-build --configuration Release
