name: build
on:
  push:
    branches: [ "chatgpt/booking-mvp-v1" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Aegis.Studio.slnx
      - run: dotnet build Aegis.Studio.slnx -c Release --no-restore
      - run: dotnet test Aegis.Studio.slnx -c Release --no-build
