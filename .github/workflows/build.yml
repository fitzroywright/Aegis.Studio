name: build
on:
  push:
    branches: [ "chatgpt/booking-mvp-v1" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  packages: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github-common --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.config
      - run: dotnet restore Aegis.Studio.slnx
      - run: dotnet build Aegis.Studio.slnx -c Release --no-restore
      - run: dotnet test Aegis.Studio.slnx -c Release --no-build
