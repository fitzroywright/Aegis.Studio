name: build

# Builds and tests are run locally on the MacBook.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common/Common.Diagnostics

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          path: Common/Common.Security

      - name: Checkout Common.Secrets
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common/Common.Secrets

      - name: Checkout Common.Messaging
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          path: Common/Common.Messaging

      - name: Checkout Common.Storage
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          path: Common/Common.Storage

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          path: Common/Common.Registration

      - name: Mirror local sibling Common layout
        shell: pwsh
        run: |
          $siblingCommon = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'Common'
          if (Test-Path $siblingCommon) {
            Remove-Item $siblingCommon -Recurse -Force
          }
          Move-Item (Join-Path $env:GITHUB_WORKSPACE 'Common') $siblingCommon

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Aegis.Studio.slnx
      - name: Build Debug
        run: dotnet build Aegis.Studio.slnx --no-restore --configuration Debug
      - name: Test Debug
        run: dotnet test Aegis.Studio.slnx --no-build --configuration Debug
      - name: Build Release
        run: dotnet build Aegis.Studio.slnx --no-restore --configuration Release
      - name: Test Release
        run: dotnet test Aegis.Studio.slnx --no-build --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install UI test dependencies
        working-directory: tests/ui
        run: npm ci

      - name: Test Studio UI behavior
        working-directory: tests/ui
        run: npm test
