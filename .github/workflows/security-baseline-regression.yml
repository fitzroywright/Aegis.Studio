name: Studio base revision regression evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aegis.Studio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baseline_tests
          POSTGRES_PASSWORD: isolated_baseline_ci_only
          POSTGRES_DB: baseline_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baseline_tests -d baseline_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      STUDIO_TEST_POSTGRES: Host=localhost;Port=5432;Database=baseline_tests;Username=baseline_tests;Password=isolated_baseline_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: Aegis.Studio
      - name: Read base revision library pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os, re
          pins = json.load(open('security-baseline.json'))['commonLibraries']
          libraries = {"Common.Security":"security","Common.Diagnostics":"diagnostics","Common.Secrets":"secrets","Common.Messaging":"messaging","Common.Storage":"storage","Common.Registration":"registration"}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for library, key in libraries.items():
                  revision = pins[library]
                  if not re.fullmatch(r'[0-9a-f]{40}', revision):
                      raise ValueError('Expected an immutable revision for ' + library)
                  print(key + '=' + revision, file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: ${{ steps.baseline.outputs.security }}
          path: Common/Common.Security
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: ${{ steps.baseline.outputs.diagnostics }}
          path: Common/Common.Diagnostics
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          ref: ${{ steps.baseline.outputs.secrets }}
          path: Common/Common.Secrets
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          ref: ${{ steps.baseline.outputs.messaging }}
          path: Common/Common.Messaging
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          ref: ${{ steps.baseline.outputs.storage }}
          path: Common/Common.Storage
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: ${{ steps.baseline.outputs.registration }}
          path: Common/Common.Registration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify base revision shared sources
        run: python3 ../Common/Common.Security/scripts/verify-source-baseline.py security-baseline.json --common-root ../Common
      - name: Base revision PostgreSQL tests
        run: dotnet test Aegis.Studio.Web.Tests/Aegis.Studio.Web.Tests.csproj -c Release -p:CommonRoot="$GITHUB_WORKSPACE/Common" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: base-revision-postgres-evidence
          path: Aegis.Studio/TestResults
  baseline-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: Aegis.Studio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Base revision UI tests
        working-directory: Aegis.Studio/tests/ui
        run: npm ci && npm test
