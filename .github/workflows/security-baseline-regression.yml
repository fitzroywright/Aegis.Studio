name: Historical Studio baseline regression evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aegis.Studio
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baseline_tests
          POSTGRES_PASSWORD: isolated_baseline_ci_only
          POSTGRES_DB: baseline_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baseline_tests -d baseline_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      STUDIO_TEST_POSTGRES: Host=localhost;Port=5432;Database=baseline_tests;Username=baseline_tests;Password=isolated_baseline_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0c97f6f8d146596f0c36b6633989d128d171369
          path: Aegis.Studio
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: be02071b608cd810ca8fc4c0545d55bc48eebed8
          path: Common/Common.Security
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: 4f90c9fd31aaa16ffbada97e33084a5356a45859
          path: Common/Common.Diagnostics
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          ref: 0e081a55d5885a148decb0c86c1baad263448948
          path: Common/Common.Secrets
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Messaging
          ref: cc015e8fcd9ea0c163859b3ed094243e4cddfbf4
          path: Common/Common.Messaging
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Storage
          ref: bface4498b63f6e0b9dae1228bd9234a3a94b4d7
          path: Common/Common.Storage
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: e673815b7e1f29ac1c713e849762e1af522a784d
          path: Common/Common.Registration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Historical baseline PostgreSQL tests
        run: dotnet test Aegis.Studio.Web.Tests/Aegis.Studio.Web.Tests.csproj -c Release -p:CommonRoot="$GITHUB_WORKSPACE/Common" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-baseline-postgres-evidence
          path: Aegis.Studio/TestResults
  baseline-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0c97f6f8d146596f0c36b6633989d128d171369
          path: Aegis.Studio
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Historical baseline UI tests
        working-directory: Aegis.Studio/tests/ui
        run: npm ci && npm test
