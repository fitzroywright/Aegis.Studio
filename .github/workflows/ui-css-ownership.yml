name: Studio UI CSS ownership
on:
  pull_request:
    paths:
      - 'Aegis.Studio.Web/wwwroot/**'
      - 'scripts/check-ui-css-ownership.cjs'
      - 'tests/ui/shared-shell-ownership.test.cjs'
      - '.github/workflows/ui-css-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'Aegis.Studio.Web/wwwroot/**'
      - 'scripts/check-ui-css-ownership.cjs'
      - 'tests/ui/shared-shell-ownership.test.cjs'
      - '.github/workflows/ui-css-ownership.yml'
jobs:
  css-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test shared shell ownership
        run: node --test tests/ui/shared-shell-ownership.test.cjs
      - name: Check ownership
        run: |
          git fetch origin main
          UI_CSS_BASE=origin/main node scripts/check-ui-css-ownership.cjs
