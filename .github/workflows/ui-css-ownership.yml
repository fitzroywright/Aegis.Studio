name: Studio UI CSS ownership
on:
  pull_request:
    paths:
      - 'Aegis.Studio.Web/wwwroot/**'
      - 'scripts/check-ui-css-ownership.cjs'
      - 'tests/ui/shared-shell-ownership.test.cjs'
      - '.github/workflows/ui-css-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'Aegis.Studio.Web/wwwroot/**'
      - 'scripts/check-ui-css-ownership.cjs'
      - 'tests/ui/shared-shell-ownership.test.cjs'
      - '.github/workflows/ui-css-ownership.yml'
jobs:
  css-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test shared shell ownership
        run: |
          set -o pipefail
          node --test tests/ui/shared-shell-ownership.test.cjs 2>&1 | tee /tmp/css-ownership-tests.log
      - name: Check ownership
        run: |
          set -o pipefail
          git fetch origin main
          UI_CSS_BASE=origin/main node scripts/check-ui-css-ownership.cjs 2>&1 | tee /tmp/css-ownership-check.log
      - name: Preserve ownership failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: css-ownership-diagnostics
          path: |
            /tmp/css-ownership-tests.log
            /tmp/css-ownership-check.log
          if-no-files-found: warn
