<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Bryan's Studio</title><link rel="stylesheet" href="site.css"></head><body><main><section class="card" style="max-width:430px;margin:8vh auto"><h1>Staff sign in</h1><p>Use your Windows username and password.</p><form id="loginForm"><label>Windows username<input id="userName" autocomplete="username" required autofocus></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:.5rem"><input id="rememberMe" type="checkbox">Keep me signed in</label><button type="submit">Sign in</button></form><p id="error" role="alert"></p></section></main><script src="login.js"></script></body></html>
