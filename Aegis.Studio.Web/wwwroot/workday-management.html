<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio WorkDay Management</title>
  <link rel="stylesheet" href="/css/workday-management.css">
</head>
<body>
  <header>
    <h1>Aegis Studio WorkDay</h1>
    <div class="muted">Authorized work-session and field-presence evidence</div>
  </header>
  <main>
    <section class="panel">
      <h2>Fleet</h2>
      <div id="fleet">Loading...</div>
    </section>
    <section class="panel">
      <h2>Recent Work Sessions</h2>
      <div id="sessions">Loading...</div>
    </section>
    <section class="panel">
      <h2>Selected Timeline</h2>
      <div id="timeline" class="muted">Select a work session.</div>
      <div id="map">Location status loading...</div>
    </section>
  </main>
  <script src="/js/workday-management.js"></script>
</body>
</html>
