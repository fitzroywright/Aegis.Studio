<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Aegis Studio</title>
<style>
  :root { font-family: Inter, "Segoe UI", Arial, sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#f6f6f6; }
  .screen { position:relative; width:min(100vw, 213.5198vh); aspect-ratio:1832/858; margin:auto; background:url('/assets/studio-login-exact.jpg') center/100% 100% no-repeat; }
  .loginForm { position:absolute; inset:0; margin:0; }
  .field { position:absolute; left:62.8%; width:27.9%; height:6.25%; }
  #userName { top:49.8%; }
  #password { top:61.8%; }
  input { display:block; border:1px solid #d7dde6; border-radius:9px; background:#fff; padding:0 12% 0 10%; width:100%; height:100%; font:500 clamp(11px, .9vw, 16px) Inter,"Segoe UI",Arial,sans-serif; color:#111827; }
  input:focus { outline:2px solid #90b9eb; outline-offset:1px; }
  #signInButton { position:absolute; top:73.2%; left:62.8%; width:27.9%; height:6.8%; border:0; border-radius:8px; background:#222529; color:white; font:600 clamp(12px,1vw,18px) Inter,"Segoe UI",Arial,sans-serif; cursor:pointer; }
  #signInButton:disabled { opacity:.65; cursor:wait; }
  #error { position:absolute; top:81%; left:62.8%; width:27.9%; color:#b42318; font-size:13px; text-align:center; background:#fff; border-radius:5px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  #environment { position:absolute; top:82.4%; left:62.8%; width:27.9%; text-align:center; font-size:clamp(9px,.8vw,13px); color:#667085; }
  [hidden] { display:none!important; }
  @media(max-aspect-ratio: 1832/858) { .screen { width:100vw; } }
  @media(max-width:700px) {
    body { background:#f6f6f6; }
    .screen { width:100%; aspect-ratio:auto; min-height:100vh; background-image:none; display:grid; place-items:center; padding:24px; }
    .screen:before { content:"Welcome to Studio"; position:absolute; top:15%; font-size:30px; font-weight:700; color:#101828; }
    .loginForm { position:relative; inset:auto; width:100%; max-width:420px; padding:28px 22px 60px; border-radius:20px; background:white; box-shadow:0 15px 50px #00000012; display:flex; flex-direction:column; gap:20px; }
    .field, #userName, #password, #signInButton, #error, #environment { position:static; width:100%; height:52px; }
    #signInButton { font-size:16px; }
    #error { height:auto; }
    #environment { height:auto; }
    input { font-size:16px; padding:12px; }
  }
</style>
</head>
<body>
<main class="screen" aria-label="Studio sign in">
  <form id="loginForm" class="loginForm">
    <label class="sr-only" for="userName">Username</label>
    <input id="userName" class="field" autocomplete="username" required aria-label="Username" placeholder="Enter your username">
    <label id="passwordLabel" class="sr-only" for="password">Password</label>
    <input id="password" class="field" type="password" autocomplete="current-password" required aria-label="Password" placeholder="Enter your password">
    <button id="signInButton" type="submit">Sign in →</button>
    <div id="error" role="alert" aria-live="polite"></div>
    <div id="environment" hidden></div>
    <p id="signInHelp" class="sr-only">Sign in to access your workspace.</p>
  </form>
</main>
  <script>
    const loginForm = document.getElementById('loginForm');
    const userName = document.getElementById('userName');
    const password = document.getElementById('password');
    const passwordLabel = document.getElementById('passwordLabel');
    const signInButton = document.getElementById('signInButton');
    const signInHelp = document.getElementById('signInHelp');
    const environment = document.getElementById('environment');
    const error = document.getElementById('error');
    let mockAuthentication = false;

    async function loadAuthenticationOptions() {
        try {
            const response = await fetch('/api/auth/options', { cache: 'no-store' });
            if (!response.ok) return;
            const options = await response.json();
            mockAuthentication = options.mockAuthentication === true;
            if (!mockAuthentication) return;

            signInHelp.textContent = 'Sign in to access your workspace.';
            environment.hidden = true;
            password.required = false;
            password.value = '';
            password.disabled = true; password.placeholder = 'Development sign-in mode';
            if (options.defaultUserName) userName.value = options.defaultUserName;
        } catch {
            // Keep the normal Active Directory login experience if the options endpoint is unavailable.
        }
    }

    loadAuthenticationOptions();

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        signInButton.disabled = true;
        signInButton.textContent = 'Signing in...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userName: userName.value.trim(),
                    password: mockAuthentication ? '' : password.value
                })
            });

            if (response.status === 401) {
                error.textContent = mockAuthentication
                    ? 'The mock sign-in identity was not accepted.'
                    : 'The user name or password was not accepted.';
                password.value = '';
                if (!mockAuthentication) password.focus();
                return;
            }

            if (!response.ok) {
                error.textContent = mockAuthentication
                    ? 'Aegis could not complete mock sign in. Check the server log.'
                    : 'Aegis could not complete sign in. Check the server log and Active Directory connection.';
                return;
            }

            sessionStorage.removeItem('studio-announcements-login');
            window.location.replace('/');
        } catch {
            error.textContent = 'Aegis could not reach the sign-in service.';
        } finally {
            signInButton.disabled = false;
            signInButton.textContent = 'Sign in →';
        }
    });
  </script>

</body>
</html>
