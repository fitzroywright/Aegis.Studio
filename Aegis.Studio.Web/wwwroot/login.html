<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Aegis Studio</title>
<style>
:root {font-family:Inter,"Segoe UI",Arial,sans-serif;color-scheme:light}
* {box-sizing:border-box}
body {margin:0;min-height:100vh;background:#30251c;color:#101828}
.screen {min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);background:url('/assets/studio-login-clean-background.jpg') center center/cover no-repeat}
.hero {min-width:0;min-height:100%}
.login-side {min-width:0;display:grid;place-items:center;padding:clamp(16px,2.4vw,44px);background:transparent}
.card {width:min(100%,580px);padding:clamp(28px,3vw,52px);border-radius:21px;background:white;box-shadow:0 20px 65px #0000000c}
.brand {display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.brand img {width:min(100%,225px);height:auto;max-height:110px;object-fit:contain}
h1 {font-size:clamp(29px,2.1vw,40px);letter-spacing:-.035em;line-height:1.2;margin:0;text-align:center}
.intro {font-size:17px;color:#64748b;text-align:center;margin:10px 0 34px}
.form-field {display:block;font-size:15px;font-weight:600;margin:0 0 23px}
.input-wrap {display:flex;align-items:center;position:relative;margin-top:9px}
.input-wrap svg {position:absolute;left:17px;width:21px;height:21px;stroke:#344054;pointer-events:none}
input {width:100%;height:52px;padding:0 50px;border:1px solid #d0d5dd;border-radius:9px;font:400 16px Inter,"Segoe UI",Arial,sans-serif;color:#101828;background:#fff}
input:focus {outline:2px solid #9dc1e8;outline-offset:1px}
.toggle-password {position:absolute;right:12px;border:0;background:transparent;padding:8px;cursor:pointer;color:#344054;display:grid;place-items:center}
.toggle-password svg {position:static;width:20px;height:20px}
#signInButton {width:100%;height:54px;margin-top:2px;border:0;border-radius:8px;background:#222529;color:white;font:600 18px Inter,"Segoe UI",Arial,sans-serif;cursor:pointer}
#signInButton:disabled {opacity:.65;cursor:wait}
#signInButton:hover:not(:disabled) {background:#34373b}
#error {color:#b42318;font-size:13px;text-align:center;margin-top:12px}
#environment {text-align:center;font-size:13px;color:#64748b;margin-top:23px}
[hidden] {display:none!important}
@media(max-width:760px) {.screen {grid-template-columns:minmax(0,1fr);grid-template-rows:180px minmax(0,1fr)}.hero {min-height:180px}.login-side {padding:24px 18px;align-items:start}.card {max-width:520px;padding:32px 25px}.brand {margin-bottom:25px}}
@media(max-width:480px) {.screen {grid-template-rows:125px minmax(0,1fr)}.hero {min-height:125px}.card {padding:25px 18px}h1 {font-size:30px}.intro {font-size:15px}}
</style>
</head>
<body>
<main class="screen">
<section class="hero" aria-label="Studio artwork"></section>
<section class="login-side">
<div class="card">
<div class="brand"><img src="/assets/bryan-studios-logo.png" alt="Bryan Studios Ltd"></div>
<h1>Welcome to Studio</h1>
<p id="signInHelp" class="intro">Sign in to access your workspace.</p>
<form id="loginForm">
<label class="form-field" for="userName">Username
<span class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><input id="userName" autocomplete="username" required placeholder="Enter your username"></span>
</label>
<label class="form-field" id="passwordLabel" for="password">Password
<span class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="toggle-password" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
</label>
<button id="signInButton" type="submit">Sign in →</button>
<div id="error" role="alert" aria-live="polite"></div>
<div id="environment" hidden></div>
</form>
</div>
</section>
</main>
  <script>
    const loginForm = document.getElementById('loginForm');
    const userName = document.getElementById('userName');
    const password = document.getElementById('password');
    const passwordLabel = document.getElementById('passwordLabel');
    const signInButton = document.getElementById('signInButton');
    const signInHelp = document.getElementById('signInHelp');
    const environment = document.getElementById('environment');
    const error = document.getElementById('error');
    let mockAuthentication = false;

    async function loadAuthenticationOptions() {
        try {
            const response = await fetch('/api/auth/options', { cache: 'no-store' });
            if (!response.ok) return;
            const options = await response.json();
            mockAuthentication = options.mockAuthentication === true;
            if (!mockAuthentication) return;

            signInHelp.textContent = 'Sign in to access your workspace.';
            environment.hidden = false; environment.textContent = 'Development sign-in mode';
            password.required = false;
            password.value = '';
            password.disabled = true; password.closest('.form-field').hidden = true;
            if (options.defaultUserName) userName.value = options.defaultUserName;
        } catch {
            // Keep the normal Active Directory login experience if the options endpoint is unavailable.
        }
    }

    document.getElementById('togglePassword').addEventListener('click', () => {
        const showing = password.type === 'text';
        password.type = showing ? 'password' : 'text';
        const toggle = document.getElementById('togglePassword');
        toggle.setAttribute('aria-pressed', String(!showing));
        toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    loadAuthenticationOptions();

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        signInButton.disabled = true;
        signInButton.textContent = 'Signing in...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userName: userName.value.trim(),
                    password: mockAuthentication ? '' : password.value
                })
            });

            if (response.status === 401) {
                error.textContent = mockAuthentication
                    ? 'The mock sign-in identity was not accepted.'
                    : 'The user name or password was not accepted.';
                password.value = '';
                if (!mockAuthentication) password.focus();
                return;
            }

            if (!response.ok) {
                error.textContent = mockAuthentication
                    ? 'Aegis could not complete mock sign in. Check the server log.'
                    : 'Aegis could not complete sign in. Check the server log and Active Directory connection.';
                return;
            }

            sessionStorage.removeItem('studio-announcements-login');
            window.location.replace('/');
        } catch {
            error.textContent = 'Aegis could not reach the sign-in service.';
        } finally {
            signInButton.disabled = false;
            signInButton.textContent = 'Sign in →';
        }
    });
  </script>


</body>
</html>
