<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in - Aegis Studio</title>
  <style>
    :root { font-family: Inter, Segoe UI, Arial, sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1118; color: #eef3f8; }
    .card { width: min(420px, calc(100vw - 32px)); background: #141c26; border: 1px solid #2a3746; border-radius: 16px; padding: 32px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
    .brand { display: flex; gap: 8px; align-items: baseline; letter-spacing: .08em; margin-bottom: 28px; }
    .brand strong { font-size: 24px; }
    .brand span { color: #8fa4b8; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #9fb0c1; line-height: 1.45; margin: 0 0 24px; }
    label { display: block; margin: 14px 0; font-size: 13px; color: #b8c6d3; }
    input { width: 100%; margin-top: 7px; border: 1px solid #344456; background: #0f1620; color: #fff; border-radius: 9px; padding: 12px 13px; font: inherit; }
    button { width: 100%; margin-top: 12px; border: 0; border-radius: 9px; padding: 12px 14px; font: inherit; font-weight: 700; background: #e8eef5; color: #111820; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { min-height: 22px; color: #ff9c9c; font-size: 13px; margin-top: 12px; }
    .environment { margin-top: 22px; padding-top: 18px; border-top: 1px solid #293645; font-size: 12px; color: #7f93a7; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><strong>AEGIS</strong><span>STUDIO</span></div>
    <h1>Sign in</h1>
    <p id="signInHelp">Enter your Windows/Active Directory user name and password. Aegis requires an explicit sign-in before any Studio workspace or client data is shown.</p>
    <form id="loginForm">
      <label>User name
        <input id="userName" autocomplete="username" autofocus required placeholder="FWright or FFPJM\\FWright">
      </label>
      <label id="passwordLabel">Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="signInButton" type="submit">Sign in</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div id="environment" class="environment">Development/testing directory: FFP Active Directory over LDAPS.</div>
  </main>
  <script>
    const loginForm = document.getElementById('loginForm');
    const userName = document.getElementById('userName');
    const password = document.getElementById('password');
    const passwordLabel = document.getElementById('passwordLabel');
    const signInButton = document.getElementById('signInButton');
    const signInHelp = document.getElementById('signInHelp');
    const environment = document.getElementById('environment');
    const error = document.getElementById('error');
    let mockAuthentication = false;

    async function loadAuthenticationOptions() {
        try {
            const response = await fetch('/api/auth/options', { cache: 'no-store' });
            if (!response.ok) return;
            const options = await response.json();
            mockAuthentication = options.mockAuthentication === true;
            if (!mockAuthentication) return;

            signInHelp.textContent = 'Mock authentication is enabled for this Development environment. Sign in with the development identity below; no directory password is required.';
            environment.textContent = 'Development mode: Mock Authentication enabled. Active Directory credentials are not used.';
            password.required = false;
            password.value = '';
            passwordLabel.style.display = 'none';
            if (options.defaultUserName) userName.value = options.defaultUserName;
        } catch {
            // Keep the normal Active Directory login experience if the options endpoint is unavailable.
        }
    }

    loadAuthenticationOptions();

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        signInButton.disabled = true;
        signInButton.textContent = 'Signing in...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userName: userName.value.trim(),
                    password: mockAuthentication ? '' : password.value
                })
            });

            if (response.status === 401) {
                error.textContent = mockAuthentication
                    ? 'The mock sign-in identity was not accepted.'
                    : 'The user name or password was not accepted.';
                password.value = '';
                if (!mockAuthentication) password.focus();
                return;
            }

            if (!response.ok) {
                error.textContent = mockAuthentication
                    ? 'Aegis could not complete mock sign in. Check the server log.'
                    : 'Aegis could not complete sign in. Check the server log and Active Directory connection.';
                return;
            }

            sessionStorage.removeItem('studio-announcements-login');
            window.location.replace('/');
        } catch {
            error.textContent = 'Aegis could not reach the sign-in service.';
        } finally {
            signInButton.disabled = false;
            signInButton.textContent = 'Sign in';
        }
    });
  </script>
</body>
</html>
