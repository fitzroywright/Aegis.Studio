<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Aegis Studio</title>
<style>
:root {font-family:Inter,"Segoe UI",Arial,sans-serif;color-scheme:light}
* {box-sizing:border-box}
body {margin:0;min-height:100vh;background:#30251c;color:#101828}
.screen {min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);background:url('/assets/aegis-studio-login-background.png') center center/cover no-repeat}
.hero {min-width:0;min-height:100%}
.login-side {min-width:0;display:grid;place-items:center;padding:clamp(16px,2.4vw,44px);background:transparent;isolation:isolate}
.card {position:relative;width:min(100%,580px);padding:clamp(28px,3vw,52px);border:1px solid rgba(255,255,255,.55);border-radius:21px;background:rgba(255,255,255,.30);-webkit-backdrop-filter:blur(15px) saturate(115%);backdrop-filter:blur(15px) saturate(115%);box-shadow:0 16px 26px rgba(32,20,12,.17),0 38px 45px -25px rgba(24,15,8,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.card::after {content:"";position:absolute;z-index:-1;left:6%;right:6%;bottom:-22px;height:28px;border-radius:50%;background:rgba(29,18,11,.28);filter:blur(17px);pointer-events:none}
.brand {display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.brand img {width:min(100%,225px);height:auto;max-height:110px;object-fit:contain}
h1 {font-size:clamp(29px,2.1vw,40px);letter-spacing:-.035em;line-height:1.2;margin:0;text-align:center}
.intro {font-size:17px;color:#64748b;text-align:center;margin:10px 0 34px}
.form-field {display:block;font-size:15px;font-weight:600;margin:0 0 23px}
.input-wrap {display:flex;align-items:center;position:relative;margin-top:9px}
.input-wrap svg {position:absolute;left:17px;width:21px;height:21px;stroke:#344054;pointer-events:none}
input,select {width:100%;height:52px;padding:0 50px;border:1px solid rgba(255,255,255,.65);border-radius:9px;font:400 16px Inter,"Segoe UI",Arial,sans-serif;color:#101828;background:rgba(255,255,255,.4)}
input:focus,select:focus {outline:2px solid #9dc1e8;outline-offset:1px}
.toggle-password {position:absolute;right:12px;border:0;background:transparent;padding:8px;cursor:pointer;color:#344054;display:grid;place-items:center}
.toggle-password svg {position:static;width:20px;height:20px}
#signInButton,#entraSignIn,#recoverButton {display:grid;place-items:center;text-decoration:none;width:100%;height:54px;margin-top:2px;border:0;border-radius:8px;background:#222529;color:white;font:600 18px Inter,"Segoe UI",Arial,sans-serif;cursor:pointer}
#signInButton:disabled {opacity:.65;cursor:wait}
#signInButton:hover:not(:disabled) {background:#34373b}
#error {color:#b42318;font-size:13px;text-align:center;margin-top:12px}
#environment {text-align:center;font-size:13px;color:#64748b;margin-top:23px}
[hidden] {display:none}
@media(max-width:760px) {.screen {grid-template-columns:minmax(0,1fr);grid-template-rows:180px minmax(0,1fr)}.hero {min-height:180px}.login-side {padding:24px 18px;align-items:start}.card {max-width:520px;padding:32px 25px}.brand {margin-bottom:25px}}
@media(max-width:480px) {.screen {grid-template-rows:125px minmax(0,1fr)}.hero {min-height:125px}.card {padding:25px 18px}h1 {font-size:30px}.intro {font-size:15px}}
</style>
</head>
<body>
<main class="screen">
<section class="hero" aria-label="Studio artwork"></section>
<section class="login-side">
<div class="card">
<div class="brand"><img src="/assets/bryan-studios-logo.png" alt="Bryan Studios Ltd"></div>
<h1>Welcome to Studio</h1>
<p id="signInHelp" class="intro">Sign in to access your workspace.</p>
<form id="loginForm">
<label class="form-field" for="authenticationSource">Sign-in method<span class="input-wrap"><select id="authenticationSource" aria-label="Sign-in method"></select></span></label>
<label class="form-field" for="userName">Username
<span class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><input id="userName" autocomplete="username" required placeholder="Enter your username"></span>
</label>
<label class="form-field" id="passwordLabel" for="password">Password
<span class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="toggle-password" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
</label>
<button id="signInButton" type="submit" disabled>Sign in →</button>
<a id="entraSignIn" href="/api/auth/entra" hidden>Sign in with Microsoft</a>
<div id="environment" hidden></div>
</form>
<form id="recoveryForm" hidden><label class="form-field" for="recoveryToken">Recovery proof<span class="input-wrap"><input id="recoveryToken" autocomplete="off" required></span></label><label class="form-field" for="recoveryPassword">New local password<span class="input-wrap"><input id="recoveryPassword" type="password" autocomplete="new-password" minlength="15" maxlength="256" required></span></label><button id="recoverButton" type="submit">Reset local password</button></form>
<button id="recoveryToggle" type="button">Recover a local account</button>
<div id="error" role="alert" aria-live="polite"></div>
</div>
</section>
</main>
  <script src="/login.js" defer></script>


</body>
</html>
