<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian’s — Booking and Gallery Reference</title>
<style>body{margin:0;background:#f3f4f6;font:16px system-ui;color:#24384e}header{background:#173c63;color:white;padding:22px;border-bottom:4px solid #ed8e31}main{max-width:900px;margin:24px auto;padding:0 20px}section{background:white;padding:24px;border-radius:10px;margin-bottom:24px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:9px;border:1px solid #b5c3d0;border-radius:5px}input,textarea{box-sizing:border-box;width:100%}button{background:#173c63;color:white;cursor:pointer}button:disabled{opacity:.6}#proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}img{width:100%;height:190px;object-fit:contain}p[role=status]{white-space:pre-wrap}footer{padding:15px;background:#66482e;color:white}</style>
<header><h1>Brian’s</h1><p>Book a session · View your proofs · Choose your photographs</p></header><main>
<section><h2>Request a booking</h2><form id="booking"><label>Your name<input name="clientName" required maxlength="200"></label><label>Email<input name="clientEmail" type="email" required></label><label>Telephone<input name="clientPhone" maxlength="80"></label><label>Session<input name="sessionType" required placeholder="Graduation, ID photo, portraits…"></label><label>Start<input name="startsAt" type="datetime-local" required></label><label>End<input name="endsAt" type="datetime-local" required></label><label>Location<input name="location" maxlength="500"></label><label>Destination / booking email<input name="destination" maxlength="320"></label><label>Notes<textarea name="notes" maxlength="4000"></textarea></label><button>Submit booking request</button></form><p role="status" id="bookingStatus"></p><button id="track" hidden>Check booking status</button></section>
<section><h2>Your customer gallery</h2><form id="gallery"><label>Gallery reference<input name="reference" required></label><label>Customer access token<input name="token" type="password" required autocomplete="off"></label><button>Open gallery</button></form><p role="status" id="galleryStatus"></p><div id="proofs"></div><button id="more" hidden>More proofs</button> <button id="submit" hidden>Submit selections</button></section></main><footer>Brian’s — Public API V1 integration example</footer>
<script type="module">
let bookingKey=crypto.randomUUID(),bookingFacts=null,reference=null,galleryRef=null,galleryToken=null,cursor=null,publication=null,selectionKey=crypto.randomUUID(),release=false;const blobs=[];
const $=id=>document.getElementById(id);
async function request(path,options={}){const r=await fetch('/api/public/v1'+path,options);if(!r.ok){let e;try{e=await r.json();}catch{}throw Error(e?.message||'Request failed ('+r.status+')');}return r;}
async function json(path,options){return (await request(path,options)).json();}
$('booking').onsubmit=async event=>{event.preventDefault();const f=event.currentTarget,b=f.querySelector('button');b.disabled=true;$('bookingStatus').textContent='Submitting…';try{const values=Object.fromEntries(new FormData(f));values.startsAt=new Date(values.startsAt).toISOString();values.endsAt=new Date(values.endsAt).toISOString();const body=JSON.stringify(values);if(bookingFacts!==null&&bookingFacts!==body)bookingKey=crypto.randomUUID();bookingFacts=body;const result=await json('/bookings',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':bookingKey},body});reference=result.reference;$('bookingStatus').textContent='Request received. Reference: '+reference+'\nDeposit requirement: '+result.currency+' '+result.requiredDeposit+'\nFront Desk will review and confirm your request.';$('track').hidden=false;}catch(e){$('bookingStatus').textContent=e.message;}finally{b.disabled=false;}};
$('track').onclick=async()=>{try{const r=await json('/bookings/'+reference);$('bookingStatus').textContent='Reference: '+r.reference+'\nStatus: '+r.status;}catch(e){$('bookingStatus').textContent=e.message;}};
function headers(){return {'Authorization':'Bearer '+galleryToken};}
$('gallery').onsubmit=async event=>{event.preventDefault();const f=event.currentTarget;galleryRef=f.elements.reference.value.trim();galleryToken=f.elements.token.value;cursor=null;publication=null;selectionKey=crypto.randomUUID();blobs.splice(0).forEach(URL.revokeObjectURL);$('proofs').replaceChildren();await load();};
async function load(){const b=$('gallery').querySelector('button');b.disabled=true;try{const page=await json('/galleries/'+galleryRef+'?limit=24'+(cursor?'&after='+cursor:''),{headers:headers()});if(publication&&publication!==page.publicationId)throw Error('Gallery changed. Open it again to review the new approved versions.');publication=page.publicationId;release=page.finalDeliveryAvailable;$('galleryStatus').textContent=page.title+' · '+(release?'Final downloads authorized':'Proofs available. Final delivery awaits payment or Finance authorization.');for(const item of page.items){const card=document.createElement('article'),img=document.createElement('img'),label=document.createElement('p'),select=document.createElement('button');label.textContent=item.fileName;select.textContent=item.selected?'Selected ✓':'Select';select.onclick=async()=>{select.disabled=true;try{item.selected=!item.selected;await json('/galleries/'+galleryRef+'/selections/'+item.versionId,{method:'PUT',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({selected:item.selected})});select.textContent=item.selected?'Selected ✓':'Select';selectionKey=crypto.randomUUID();}catch(e){item.selected=!item.selected;$('galleryStatus').textContent=e.message;}finally{select.disabled=false;}};card.append(img,label,select);$('proofs').append(card);try{const media=await request('/galleries/'+galleryRef+'/items/'+item.versionId+'/thumbnail',{headers:headers()}),url=URL.createObjectURL(await media.blob());blobs.push(url);img.src=url;img.alt='Watermarked proof: '+item.fileName;}catch{img.alt='Proof unavailable. Reopen the gallery to retry.';}if(release){const download=document.createElement('button');download.textContent='Download final';download.onclick=async()=>{download.disabled=true;try{const r=await request('/galleries/'+galleryRef+'/items/'+item.versionId+'/download',{headers:headers()}),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=item.fileName;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(e){$('galleryStatus').textContent=e.message;}finally{download.disabled=false;}};card.append(download);}}cursor=page.nextCursor;$('more').hidden=!cursor;$('submit').hidden=false;}catch(e){$('galleryStatus').textContent=e.message;}finally{b.disabled=false;}}
$('more').onclick=load;
$('submit').onclick=async()=>{const b=$('submit');b.disabled=true;try{const r=await json('/galleries/'+galleryRef+'/selections/submit',{method:'POST',headers:{...headers(),'Idempotency-Key':selectionKey}});$('galleryStatus').textContent=r.versionIds.length+' selections submitted. Reference: '+r.reference;}catch(e){$('galleryStatus').textContent=e.message;}finally{b.disabled=false;}};
</script></html>
